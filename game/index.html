<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon — The Last Lighthouse</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Only shown with ?debug=1: a live readout of the game's state. */
  #debug { position: fixed; left: 8px; bottom: 8px; z-index: 2; margin: 0; padding: 6px 8px; background: rgba(0, 0, 0, 0.7); color: #7fd4ff; font: 12px monospace; white-space: pre; display: none; }
  #debug.on { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Beacon, the Last Lighthouse: aim the lighthouse beam with the mouse to burn the creatures rising from the dark sea"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="debug"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
